<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="mixtape-yungluxn — projetos musicais de Yung Luxn.">
  <title>mixtape-yungluxn — projetos</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <div class="site">
    <header class="site-header">
      <a href="/" id="homeLink" class="wordmark">mixtape-yungluxn<span class="period">.</span></a>
    </header>
    <main id="inicio">
      <section id="homeView" aria-label="Projetos">
        <div class="intro"><h1>projetos<span class="period">.</span></h1><p>um arquivo pessoal de música, ideias e experimentos.</p></div>
        <section class="collection" aria-label="Biblioteca de projetos">
          <div class="section-top"><span id="projectCount" class="count"></span></div>
          <div class="projects" id="projectsList"></div>
          <p id="emptyState" class="empty" hidden>nenhum projeto publicado ainda.</p>
        </section>
      </section>
      <article id="projectView" class="project-page" hidden aria-labelledby="projectTitle">
        <a href="/" id="backLink" class="back-link">← todos os projetos</a>
        <div class="release-layout">
          <div class="release-artwork"><button type="button" id="openCoverButton" class="cover-zoom-trigger" aria-label="Ampliar capa do álbum" title="Clique para ampliar a capa"><div id="projectCover" class="release-cover"></div></button></div>
          <div class="release-content">
            <p id="projectYear" class="eyebrow"></p>
            <div class="release-title-row">
              <h1 id="projectTitle" class="release-title"></h1>
              <button type="button" id="playProjectButton" class="release-play-action album-play-button" aria-label="Reproduzir álbum desde a primeira faixa" title="Reproduzir álbum desde o início"></button>
            </div>
            <p id="projectArtist" class="release-artist"></p>
            <p id="projectDescription" class="release-description"></p>
            <div class="tracklist-heading"><h2>faixas</h2><span id="trackSummary"></span></div>
            <div id="projectTracks" class="dialog-tracks"></div>
          </div>
        </div>
      </article>
      <section id="notFoundView" class="not-found" hidden><h1>projeto não encontrado.</h1><a href="/" id="notFoundLink">← voltar aos projetos</a></section>
    </main>
    <footer class="site-footer">© <span id="year"></span> mixtape-yungluxn</footer>
  </div>
  <aside id="persistentPlayer" class="persistent-player" hidden aria-label="Reprodutor de música">
    <div class="player-inner">
      <div class="player-identity">
        <div id="playerCover" class="player-cover"></div>
        <div class="player-info"><strong id="playerTitle">Selecione uma faixa</strong><span id="playerArtist">Yung Luxn</span></div>
      </div>
      <div class="player-main">
        <div class="player-buttons">
          <button type="button" id="prevButton" aria-label="Faixa anterior" title="Faixa anterior">⏮</button>
          <button type="button" id="playButton" class="play-button" aria-label="Reproduzir">▶</button>
          <button type="button" id="nextButton" aria-label="Próxima faixa" title="Próxima faixa">⏭</button>
        </div>
        <div class="progress-row">
          <span id="elapsedTime">0:00</span>
          <input type="range" id="seekBar" min="0" max="100" value="0" aria-label="Progresso da música">
          <span id="totalTime">0:00</span>
        </div>
      </div>
      <div class="player-volume"><span aria-hidden="true">♫</span><input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div>
    </div>
    <p id="audioError" class="audio-error" role="status" hidden></p>
  </aside>
  <dialog id="coverLightbox" class="cover-lightbox" aria-label="Capa ampliada do álbum">
    <button type="button" id="closeCoverButton" class="cover-lightbox-close" aria-label="Fechar capa ampliada" title="Fechar">×</button>
    <img id="enlargedCover" class="cover-lightbox-image" alt="">
  </dialog>
  <audio id="trackPlayer" preload="metadata"></audio>
</body>
</html>
