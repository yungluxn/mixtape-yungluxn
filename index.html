<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="mixtape-yungluxn — meus projetos musicais.">
  <title>mixtape-yungluxn — projetos</title>
  <link rel="stylesheet" href="style.css">
  <script src="playlists.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="site">
    <header class="site-header">
      <a href="#inicio" class="wordmark">mixtape-yungluxn<span class="period">.</span></a>
    </header>
    <main id="inicio">
      <section class="intro" aria-labelledby="introTitle">
        <h1 id="introTitle">projetos<span class="period">.</span></h1>
        <p>um arquivo pessoal de música, ideias e experimentos.</p>
      </section>
      <section class="collection" aria-label="Biblioteca de projetos">
        <div class="section-top"><span id="projectCount" class="count"></span></div>
        <div class="projects" id="projectsList"></div>
        <p id="emptyState" class="empty" hidden>nenhum projeto publicado ainda.</p>
      </section>
    </main>
    <footer class="site-footer">© <span id="year"></span> mixtape-yungluxn</footer>
  </div>
  <dialog id="projectDialog" class="project-dialog" aria-labelledby="dialogTitle">
    <button id="closeDialog" class="close-dialog" aria-label="Fechar projeto">×</button>
    <div class="dialog-layout">
      <div id="dialogCover" class="dialog-cover"></div>
      <div class="dialog-info">
        <p class="eyebrow" id="dialogYear"></p>
        <h2 id="dialogTitle"></h2>
        <p class="dialog-desc" id="dialogDesc"></p>
        <div id="dialogTracks" class="dialog-tracks"></div>
      </div>
    </div>
  </dialog>
</body>
</html>
